# Builds the Windows installer and publishes a GitHub release when a version tag is pushed
# (scripts/release.ps1 does the tagging). The release includes latest.json, which installed
# copies of ModHeim read to find and verify updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Releases are signed so installed copies can verify updates. Without the signing key
  # secret the build is skipped (a release can still be published from a local build).
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"; else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so the release build was skipped."
          fi

  release:
    needs: check
    if: needs.check.outputs.has_key == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --quiet

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ModHeim ${{ github.ref_name }}
          releaseBody: |
            Download **ModHeim_*_x64-setup.exe** below and run it. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
